name: CI

on:
    push:
        branches:
            - '**'
jobs:
    build:
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: task_management
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping --silent"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            # Checkout repo
            - name: Checkout repository
              uses: actions/checkout@v4

            # ---- Backend ----
            - name: Build backend Docker image
              run: docker build -f docker/php-fpm/Dockerfile -t task-management-php:latest .

            - name: Start backend container
              run: |
                  docker run -d \
                    --name task-management-php \
                    --env-file backend/.env \
                    --network host \
                    task-management-php:latest

            - name: Wait for database
              run: |
                  until docker exec task-management-php php bin/console doctrine:query:sql "SELECT 1" >/dev/null 2>&1; do
                    sleep 1
                  done

            - name: Run migrations
              run: docker exec task-management-php php bin/console doctrine:migrations:migrate --no-interaction

            - name: Run PHPUnit tests
              run: docker exec task-management-php vendor/bin/phpunit

            - name: Run PHPCS (PSR-12)
              run: docker exec task-management-php vendor/bin/phpcs -n -s -p --standard=PSR12 src/

            - name: Run PHPStan (level 2)
              run: docker exec task-management-php vendor/bin/phpstan analyse -l 2 --memory-limit=512M --error-format=raw src/

            # ---- Frontend ----
            - name: Build frontend Docker image
              run: docker build -f docker/node/Dockerfile -t task-management-node:latest .

            - name: Install frontend dependencies & build
              run: |
                  docker run --rm \
                    -v ${{ github.workspace }}/frontend:/web/frontend \
                    task-management-node:latest \
                    sh -c "npm install && npm run dev"
